{% extends 'base.html' %}
{% block content %}
<h2>Deposit Money</h2>
<form method="POST">
    {% csrf_token %}
    <label>Enter Amount (₹):</label>
    <input type="number" name="amount" step="0.01" required>
    <button type="submit" class="btn btn-blue">Deposit</button>
</form>
<br>
<a href="{% url 'dashboard' %}">Back to Dashboard</a>
{% endblock %}
